<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Mod</title>
    
    <!-- Fix: Forcing all engine setup definitions to exist BEFORE any files touch the engine -->
    <script>
        var VERSION = 2.052; 
        var BETA = 0;        
        var App = {};        
        var Game = {};       
        var SAVESUFFIX = ''; 
        var AMENU = 0;       
        var LOCAL = 0;       

        // Giving minigames an explicitly drawn canvas zone safely
        Game.Objects = {
            'Farm': {},
            'Wizard tower': {},
            'Bank': {},
            'Temple': {}
        };

        // Standard document locator utility used by Cookie Clicker
        function l(id) { 
            return document.getElementById(id); 
        }
    </script>
</head>
<body>

    <!-- Structuring layout divisions so innerHTML queries have a guaranteed landing target -->
    <div id="game">
        <div id="langSelect"></div>
    </div>
    <div id="comments"></div>
    <div id="cookies"></div>
    <div id="bakeryName"></div>
    <div id="buildings"></div>
    <div id="sectionLeft"></div>
    <div id="sectionMiddle"></div>
    <div id="sectionRight"></div>

    <!-- Core Game Scripts loaded in sequential synchronization order -->
    <script src="main.js"></script>
    <script src="minigamegarden.js"></script>
    <script src="minigameGrimoire.js"></script>
    <script src="minigameMarket.js"></script>
    <script src="minigamePantheon.js"></script>

</body>
</html>
