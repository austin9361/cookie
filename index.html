<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Mod</title>
</head>
<body>

    <!-- Fix: Providing the core layout tags Cookie Clicker expects to find -->
    <div id="game">
        <div id="langSelect"></div> <!-- Fixes the showLangSelect innerHTML crash -->
    </div>
    
    <div id="comments"></div>
    <div id="cookies"></div>
    <div id="bakeryName"></div>
    <div id="buildings"></div>
    <div id="sectionLeft"></div>
    <div id="sectionMiddle"></div>
    <div id="sectionRight"></div>

    <!-- Fix: Injecting global configuration variables -->
    <script>
        var VERSION = 2.052; 
        var BETA = 0;        
        var App = {};        
        var Game = {};       
        var SAVESUFFIX = ''; 
        var AMENU = 0;       
        var LOCAL = 0;       

        // Safe building blocks for minigames
        Game.Objects = {
            'Farm': {},
            'Wizard tower': {},
            'Bank': {},
            'Temple': {}
        };

        // Utility helper function: Cookie Clicker uses l() as a shortcut to find layout IDs
        function l(id) { 
            return document.getElementById(id); 
        }
    </script>

    <!-- Core Game Scripts -->
    <script src="main.js"></script>
    <script src="minigamegarden.js"></script>
    <script src="minigameGrimoire.js"></script>
    <script src="minigameMarket.js"></script>
    <script src="minigamePantheon.js"></script>

</body>
</html>
