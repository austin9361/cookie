<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Sandbox Edition</title>
    
    <!-- Loading official styling from the game network to restore graphics -->
    <link rel="stylesheet" href="https://dashnet.org">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body class="title">

    <div id="wrapper">
        <div id="game">
            <div id="javascriptError" style="padding:40px;color:#fff;font-size:16px;">
                Your modded game engine environment is loading... 
                If the screen stays blank for more than 10 seconds, a mod script mismatch is present.
            </div>
            
            <div id="background"></div>
            <div id="comments" class="commentsHolder"></div>
            <div id="menu"></div>
            <div id="sectionLeft" class="inset"></div>
            <div id="sectionMiddle" class="inset"></div>
            <div id="sectionRight" class="inset"></div>
            <div id="tooltipAnchor"></div>
        </div>
    </div>

    <!-- Pre-configuring standard game workspace properties -->
    <script>
        window.DataDir = 'https://dashnet.org';
        window.ajax = function(url, callback) {
            fetch(url).then(res => res.text()).then(text => callback(text));
        };
    </script>

    <!-- Core Game Scripts Sequential Stack -->
    <script src="main.js"></script>
    <script src="minigamegarden.js"></script>
    <script src="minigameGrimoire.js"></script>
    <script src="minigameMarket.js"></script>
    <script src="minigamePantheon.js"></script>

</body>
</html>
