<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Mod</title>
</head>
<body>

    <div id="game">
        <h1>Loading Cookie Clicker...</h1>
        <p>If the page remains blank, check your browser developer console (Ctrl + Shift + J).</p>
    </div>

    <!-- Fix: Injecting all global variables required by main.js and minigames -->
    <script>
        var VERSION = 2.052; 
        var BETA = 0;        // Fixes the "BETA is not defined" crash
        var App = {};        // Prevents downstream app utility crashes
        var Game = {};       // Sets up the core game engine container
        
        // This gives the minigames a safe place to read building properties
        Game.Objects = {
            'Farm': {},
            'Wizard tower': {},
            'Bank': {},
            'Temple': {}
        };
    </script>

    <!-- Core Game Scripts -->
    <script src="main.js"></script>
    <script src="minigamegarden.js"></script>
    <script src="minigameGrimoire.js"></script>
    <script src="minigameMarket.js"></script>
    <script src="minigamePantheon.js"></script>

</body>
</html>
